{% extends "layout.html" %}

{% block title %}Edit member{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 400px;">
    <div class="mb-4">
        <div class="row p-auto m-auto">
            <div class="col-auto p-0 d-flex align-items-center">
                <form action="{{ url_for('ranking') }}" method="GET">
                    <button type="submit" class="btn btn-generic px-1 py-1 d-flex align-items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                        </svg>
                    </button>
                </form>
            </div>
            <div class="col d-flex align-items-center px-2">
                <h2 class="mb-0">Edit member</h2>
            </div>
        </div>
    </div>
    {% include 'edit_member_partial.html' %}
</div>
{% endblock %}
