{% extends "layout.html" %}

{% block title %}Edit member{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 400px;">
    <div class="mb-4">
        <div class="row p-auto m-auto">
            <div class="col-auto p-0">
                <form action="{{ url_for('ranking') }}" method="GET">
                    <button type="submit" class="btn btn-generic px-1 py-0 d-inline-flex">

                    </button>
                </form>
            </div>
            <div class="col d-flex align-items-center px-2">
                <h2 class="mb-0">Edit member</h2>
            </div>
        </div>
    </div>
    {% include 'edit_member_partial.html' %}
</div>
{% endblock %}
