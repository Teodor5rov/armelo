<div class="modal-body">
    <p>Are you sure you want to confirm this match?</p>
    {% include 'matches_partial.html' %}
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" popovertarget="confirmModal" popovertargetaction="hide">Cancel</button>
    <form action="{{ url_for('confirm_match') }}" method="POST">
        <input type="hidden" name="match_id" value="{{ match_id }}">
        <button type="submit" name="remove_match" class="btn btn-danger">Remove</button>
        <button type="submit" name="confirm_match" class="btn btn-primary">Confirm</button>
    </form>
</div>
