<div class="modal-body">
    <span>Are you sure you want to confirm this match?</span>
    <div class="mt-4">{% include 'matches_partial.html' %}</div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <form action="{{ url_for('confirm_match') }}" method="POST">
        <input type="hidden" name="match_id" value="{{ match_id }}">
        <button type="submit" name="remove_match" class="btn btn-danger">Remove</button>
        <button type="submit" name="confirm_match" class="btn btn-success">Confirm</button>
    </form>
</div>
