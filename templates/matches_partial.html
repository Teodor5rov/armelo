{% from 'macros.html' import modal_header %}
<div class="stack">
{% for match in matches %}
{% set data = formatted_data[loop.index0] %}
{% if can_confirm_matches %}
<button type="button" class="card-button" hx-post="{{ url_for('confirm_match', match_id=match['id']) }}" hx-target="#confirmMatch" popovertarget="confirmModal" popovertargetaction="show">
{% endif %}
    <div class="card match {{ wins_losses[loop.index0] if wins_losses else '' }}">
        <div class="match-players">
            <div>
                {% if match['armwrestler1_rank'] %}
                <span class="muted">#{{ match['armwrestler1_rank'] }}</span>
                {% endif %}
                <a href="{{ url_for('view_member', id=match['armwrestler1_id'], arm=match['arm']) }}" class="name-link">{{ match['armwrestler1_name'] }}</a>
                <span class="elo">{{ match['armwrestler1_elo'] }} <span class="{{ data.diff1_color }}">{{ data.diff1_text }}</span></span>
            </div>
            <span class="badge">VS</span>
            <div>
                {% if match['armwrestler2_rank'] %}
                <span class="muted">#{{ match['armwrestler2_rank'] }}</span>
                {% endif %}
                <a href="{{ url_for('view_member', id=match['armwrestler2_id'], arm=match['arm']) }}" class="name-link">{{ match['armwrestler2_name'] }}</a>
                <span class="elo">{{ match['armwrestler2_elo'] }} <span class="{{ data.diff2_color }}">{{ data.diff2_text }}</span></span>
            </div>
        </div>
        <dl class="match-meta">
            <div>
                <dt>Arm:</dt>
                <dd>{{ match['arm'] }}</dd>
            </div>
            <div>
                <dt>Format:</dt>
                <dd>{{ match['selected_format'] }}</dd>
            </div>
            <div>
                <dt>Result:</dt>
                <dd><span class="badge {{ data.score1_color }}">{{ match['armwrestler1_score'] }}</span> : <span class="badge {{ data.score2_color }}">{{ match['armwrestler2_score'] }}</span></dd>
            </div>
            <div>
                <dt>Date:</dt>
                <dd>{{ data.date }}</dd>
            </div>
        </dl>
    </div>
{% if can_confirm_matches %}
</button>
{% endif %}
{% endfor %}
</div>

{% if can_confirm_matches %}
<div class="modal modal-xl" id="confirmModal" popover role="dialog" aria-labelledby="confirmModalLabel">
    {{ modal_header('confirmModal', 'Confirm Match') }}
    <div id="confirmMatch"></div>
</div>
{% endif %}
