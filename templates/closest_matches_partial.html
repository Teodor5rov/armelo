<div class="btn-group btn-group-toggle mb-3 w-100" data-toggle="buttons">
    <a href="{{ url_for('closest_matches', arm='right') }}" 
       class="btn btn-primary w-50 {{ 'active' if arm == 'right' else '' }}"
       role="button"
       hx-get="{{ url_for('closest_matches', arm='right') }}"
       hx-target="#closest_matches"
       hx-swap="innerMorph"
       hx-push-url="true"
       aria-pressed="{{ 'true' if arm == 'right' else 'false' }}">Right arm</a>
    <a href="{{ url_for('closest_matches', arm='left') }}"
       class="btn btn-primary w-50 {{ 'active' if arm == 'left' else '' }}"
       role="button"
       hx-get="{{ url_for('closest_matches', arm='left') }}"
       hx-target="#closest_matches"
       hx-swap="innerMorph"
       hx-push-url="true"
       aria-pressed="{{ 'true' if arm == 'left' else 'false' }}">Left arm</a>
</div>

{% for match in closest_matches_with_predictions %}
{% if supermatch_add %}
<form action="{{ url_for('supermatch') }}" method="POST" class="col-12 mb-3">
{% else %}
<form action="{{ url_for('prediction') }}" method="GET" class="col-12 mb-3">
{% endif %}
    <input type="hidden" name="arm" value="{{ arm }}">
    <input type="hidden" name="armwrestler1" value="{{ match[1] }}">
    <input type="hidden" name="armwrestler2" value="{{ match[5] }}">
    <button type="submit" class="btn btn-light p-0 w-100">
        <div class="card">
            <div class="card-header bg-transparent">
                <div class="row mt-2">
                    <div class="col-12 col-lg-auto mb-2 d-flex justify-content-center">
                        <div class="d-flex align-items-center gap-0 align-middle">
                            {% if match[0] %}
                            <strong class="align-middle p-1">#{{ match[0] }}</strong>
                            {% endif %}
                            <a href="{{ url_for('view_member', id=match[1], arm=arm) }}" class="btn btn-generic text-start px-2 py-1 m-0 text-nowrap">
                                {{ match[2] }}
                            </a>
                            <strong class="text-nowrap align-middle">({{ match[3] }})</strong>
                        </div>
                    </div>
                    <div class="col-12 col-lg-auto text-center mb-2 d-flex align-items-center justify-content-center">
                        <span class="badge bg-dark">VS</span>
                    </div>
                    <div class="col-12 col-lg-auto mb-2 d-flex justify-content-center">
                        <div class="d-flex align-items-center gap-0 align-middle">
                            {% if match[4] %}
                            <strong class="align-middle p-1">#{{ match[4] }}</strong>
                            {% endif %}
                            <a href="{{ url_for('view_member', id=match[5], arm=arm) }}" class="btn btn-generic text-start px-2 py-1 m-0 text-nowrap">
                                {{ match[6] }}
                            </a>
                            <strong class="text-nowrap align-middle">({{ match[7] }})</strong>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="card-text">
                    <div class="row justify-content-md-center justify-content-lg-start">
                        <div class="col-12 col-md-auto mb-2 mb-md-0 text-start">
                            Win chance:<span class="fs-6 badge text-{{ match[11] }}">{{ match[9] }}%</span>|<span class="fs-6 badge text-{{ match[12] }}">{{ match[10] }}%</span>
                        </div>
                        <div class="col-12 col-md-auto mb-2 mb-md-0 text-start">
                            ELO difference:<span class="fs-6 badge text-dark">{{ match[8] }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </button>
</form>
{% endfor %}
