<div class="modal-body">
    <p>Are you sure you want to undo the last match?</p>
    {% include 'matches_partial.html' %}
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" popovertarget="undoModal" popovertargetaction="hide">Cancel</button>
    <form action="{{ url_for('undo_last_match') }}" method="POST">
        <button type="submit" name="undo_match" class="btn btn-danger">Undo match</button>
    </form>
</div>
