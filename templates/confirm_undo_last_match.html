<div class="modal-body">
    <span>Are you sure you want to undo the last match?</span>
    <div class="mt-4">{% include 'matches_partial.html' %}</div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <form action="{{ url_for('undo_last_match') }}" method="POST">
        <button type="submit" name="undo_match" class="btn btn-danger">Undo match</button>
    </form>
</div>
